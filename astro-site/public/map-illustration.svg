<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Norgeskart illustrasjon</title>
  <desc id="desc">Dekorativ illustrasjon av Norge med regionmarkører (plassholderkart).</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f4eee3" />
      <stop offset="1" stop-color="#eef7fb" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#163875" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- stylized Norway silhouette (abstracted shape) -->
  <g transform="translate(120,60) scale(0.9)" fill="#ffffff" filter="url(#soft)">
    <path d="M120 40 C 110 80, 90 140, 80 200 C 70 260, 60 320, 68 380 C 78 450, 110 500, 160 540 C 220 590, 300 600, 360 580 C 420 560, 470 520, 520 500 C 560 485, 600 470, 650 460 C 700 452, 760 460, 820 470 C 860 480, 910 510, 940 560 C 980 620, 1020 680, 1080 700 C 1140 720, 1220 700, 1260 660 C 1300 620, 1330 560, 1340 500 C 1350 440, 1340 380, 1330 320 C 1320 260, 1290 220, 1260 180 C 1230 140, 1180 120, 1130 110 C 1080 100, 1020 95, 980 82 C 940 70, 900 60, 850 54 C 800 48, 740 44, 700 40 C 660 36, 620 32, 580 30 C 540 28, 500 26, 460 24 C 420 22, 380 20, 340 22 C 300 24, 260 30, 230 40 C 200 50, 160 60, 120 40 Z"/>
  </g>

  <!-- region markers -->
  <g fill="none" stroke="#163875" stroke-width="2">
    <circle cx="300" cy="240" r="10" fill="#5fc1d6" />
    <circle cx="520" cy="340" r="10" fill="#5fc1d6" />
    <circle cx="900" cy="420" r="10" fill="#5fc1d6" />
    <circle cx="1200" cy="300" r="10" fill="#5fc1d6" />
  </g>

  <g font-family="Public Sans, Arial, sans-serif" fill="#163875">
    <text x="290" y="220" font-size="14" font-weight="700">Oslo-regionen</text>
    <text x="500" y="320" font-size="14" font-weight="700">Vestlandet</text>
    <text x="880" y="400" font-size="14" font-weight="700">Midt-Norge</text>
    <text x="1180" y="280" font-size="14" font-weight="700">Nord-Norge</text>
  </g>

  <g transform="translate(40,740)" fill="#163875" font-family="Public Sans, Arial, sans-serif">
    <rect x="0" y="-18" width="520" height="48" rx="8" fill="#fff" opacity="0.9" />
    <text x="18" y="16" font-size="16" font-weight="700">Norgeskart (illustrasjon) — plassholder for søk etter lokale klinikker</text>
  </g>
</svg>
